name: Plugin checks

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install "maibot-plugin-sdk==2.12.0" -r requirements.txt "ruff>=0.12,<1"
      - name: Lint
        run: python -m ruff check .
      - name: Check public source files
        run: python scripts/check_release.py
      - name: Offline tests
        run: python scripts/run_tests.py
